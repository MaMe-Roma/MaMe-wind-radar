name: Prova Radar kite (Windows)
on: push
jobs:
  prova:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fuso orario di Roma
        run: tzutil /s "W. Europe Standard Time"
      - name: Impostazioni e dati di prova
        shell: powershell
        run: |
          $rk = "$PWD\radarkite"; New-Item -ItemType Directory -Force "$PWD\pdfout" | Out-Null
          $imp = @('casa = Via Civitavecchia, Roma', 'lavoro = Piazza Venezia, Roma', 'partenza = casa', 'avvio_automatico = si', "dropbox = $PWD\pdfout", 'google_chiave =')
          [IO.File]::WriteAllLines("$rk\impostazioni.txt", $imp)
          $ieri = (Get-Date).Date.AddDays(-1).ToString('yyyy-MM-dd'); $mese = (Get-Date).Date.AddDays(-1).ToString('yyyy-MM')
          $st = @('data;stazione;spot;vento;raffica;gradi') + (10..15 | ForEach-Object { "$ieri $('{0:D2}' -f $_):05;lni_ostia;ostia;$(12 + $_ - 10);$(18 + $_ - 10);260" })
          [IO.File]::WriteAllLines("$rk\storico.csv", $st)
          New-Item -ItemType Directory -Force "$rk\dati" | Out-Null
          $pv = @('giorno;spot;anticipo;fonte;ora;vento;raffica;gradi;salvata') + (8..16 | ForEach-Object { "$ieri;ostia;0;wg;$_;$(14 + [Math]::Min($_ - 8, 4));22;255;06:30" }) + (8..16 | ForEach-Object { "$ieri;ostia;0;om;$_;$(11 + [Math]::Min($_ - 8, 3));18;250;06:30" })
          [IO.File]::WriteAllLines("$rk\dati\previsioni-$mese.csv", $pv)
      - name: Avvia Radar kite 2.0
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -Command "& '.\radarkite\radar-kite.ps1' -NonAprire"
      - name: Avvio automatico, diario dal link, PDF
        shell: powershell
        run: |
          $t = Get-ScheduledTask -TaskName 'Radar kite'; "Attivita': $($t.TaskName) - $($t.Actions[0].Arguments)"; $t.Triggers | ForEach-Object { "Inizio $($_.StartBoundary) ogni $($_.Repetition.Interval) per $($_.Repetition.Duration)" }
          $prima = (Get-Item radarkite\report.html).LastWriteTime
          Start-Process 'radarkite://uscita?d=2026-11-18&o=11:00&s=ostia&m=60&v=12&n=prova+dal+link'
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 2; if ((Get-Item radarkite\report.html).LastWriteTime -gt $prima) { break } }
          "Diario:"; Get-Content radarkite\dati\diario.csv
          "Corsa automatica:"; powershell -NoProfile -ExecutionPolicy Bypass -File radarkite\radar-kite.ps1 -Automatico | Select-Object -Last 5
          "File dati:"; Get-ChildItem radarkite\dati | ForEach-Object { "$($_.Name) $($_.Length)" }
          "PDF:"; Get-ChildItem pdfout | ForEach-Object { "$($_.Name) $($_.Length)" }
          "Viaggi:"; if (Test-Path radarkite\dati\viaggi.json) { Get-Content radarkite\dati\viaggi.json }
      - name: Report e PDF in base64 a pezzi
        if: always()
        shell: powershell
        run: |
          function Pezzi($tag, $file) { if (-not (Test-Path $file)) { return }; $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes($file)); for ($i = 0; $i -lt $b.Length; $i += 40000) { "$tag" + ($i / 40000) + ':' + $b.Substring($i, [Math]::Min(40000, $b.Length - $i)) } }
          Pezzi 'HTML' 'radarkite\report.html'
          Pezzi 'PDF' 'pdfout\Radar kite.pdf'
