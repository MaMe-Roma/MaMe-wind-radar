name: Prova Radar kite (Windows)
on: push
jobs:
  prova:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fuso orario di Roma
        run: tzutil /s "W. Europe Standard Time"
      - name: Storico di prova per lunedi e martedi
        shell: powershell
        run: |
          $r = @('data;stazione;spot;vento;raffica;gradi', '2026-11-16 11:10;torvaianica;torva;17;22;250', '2026-11-16 12:40;torvaianica;torva;19;24;255', '2026-11-16 12:45;msn;msn;12.5;16.9;230', '2026-11-17 09:00;lni_ostia;ostia;9.1;12;140', '2026-11-17 20:00;msn;msn;25;30;240')
          [IO.File]::WriteAllLines("$PWD\radarkite\storico.csv", $r)
      - name: Avvia Radar kite con PowerShell 5.1
        shell: cmd
        run: |
          mkdir grezzi
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$PSVersionTable.PSVersion; & '.\radarkite\radar-kite.ps1' -NonAprire -SalvaGrezzi (Resolve-Path grezzi).Path"
      - name: Prova del pulsante Aggiorna (link radarkite://)
        shell: powershell
        run: |
          (Get-ItemProperty 'HKCU:\Software\Classes\radarkite\shell\open\command').'(default)'
          $f = Get-Item radarkite\report.html; $prima = $f.LastWriteTime; "Report prima: $prima"
          Start-Sleep -Seconds 2
          Start-Process 'radarkite://aggiorna'
          for ($i = 0; $i -lt 45; $i++) { Start-Sleep -Seconds 2; if ((Get-Item radarkite\report.html).LastWriteTime -gt $prima) { break } }
          $dopo = (Get-Item radarkite\report.html).LastWriteTime; "Report dopo: $dopo"
          if ($dopo -le $prima) { throw 'il link radarkite:// non ha rigenerato il report' } else { 'OK: il link ha rigenerato il report' }
      - name: Report in base64
        if: always()
        shell: powershell
        run: "'B64:' + [Convert]::ToBase64String([IO.File]::ReadAllBytes('radarkite\\report.html'))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: |
            radarkite/report.html
            grezzi
