name: Prova Radar kite (Windows)
on: push
jobs:
  prova:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fuso orario di Roma
        run: tzutil /s "W. Europe Standard Time"
      - name: Impostazioni e dati di prova
        shell: powershell
        run: |
          $rk = "$PWD\radarkite"; New-Item -ItemType Directory -Force "$PWD\pdfout" | Out-Null
          $imp = @('casa = Piazza Venezia 1, Roma', 'lavoro = Studio (41.89580, 12.48270)', 'partenza = casa', 'avvio_automatico = si', "dropbox = $PWD\pdfout", 'google_chiave =')
          [IO.File]::WriteAllLines("$rk\impostazioni.txt", $imp)
          $ieri = (Get-Date).Date.AddDays(-1).ToString('yyyy-MM-dd'); $mese = (Get-Date).Date.AddDays(-1).ToString('yyyy-MM')
          $st = @('data;stazione;spot;vento;raffica;gradi') + (10..15 | ForEach-Object { "$ieri $('{0:D2}' -f $_):05;lni_ostia;ostia;$(12 + $_ - 10);$(18 + $_ - 10);260" })
          [IO.File]::WriteAllLines("$rk\storico.csv", $st)
          New-Item -ItemType Directory -Force "$rk\dati" | Out-Null
          $pv = @('giorno;spot;anticipo;fonte;ora;vento;raffica;gradi;salvata') + (8..16 | ForEach-Object { "$ieri;ostia;0;wg;$_;$(14 + [Math]::Min($_ - 8, 4));22;255;06:30" }) + (8..16 | ForEach-Object { "$ieri;ostia;0;om;$_;$(11 + [Math]::Min($_ - 8, 3));18;250;06:30" })
          [IO.File]::WriteAllLines("$rk\dati\previsioni-$mese.csv", $pv)
          # Storico finto grande (come dopo settimane di avvii ogni ora): letture e previsioni dei giorni 1-19 del mese.
          $ids = @(@('rdt_civitavecchia','sag'),@('msn','msn'),@('passoscuro','msn'),@('fregene','fregene'),@('lni_ostia','ostia'),@('torvaianica','torva'),@('anzio_levante','anzio'),@('anzio_porto','anzio'),@('latina_lido','latina'),@('latina_sud','latina'),@('saltodifondi','fondi'))
          $lt = New-Object System.Collections.Generic.List[string]; $pf = New-Object System.Collections.Generic.List[string]
          $m0 = (Get-Date).Date.AddDays(-(Get-Date).Day + 1)
          for ($d = 0; $d -lt ((Get-Date).Day - 2); $d++) { $gg = $m0.AddDays($d).ToString('yyyy-MM-dd')
            for ($q = 0; $q -lt 30; $q++) { $hh = 7 + [int]($q / 2.3); $mm = ($q * 7) % 60; foreach ($x in $ids) { $lt.Add("$gg $('{0:D2}' -f $hh):$('{0:D2}' -f $mm);$($x[0]);$($x[1]);$(8 + ($q % 12));$(12 + ($q % 12));$((200 + $q * 5) % 360)") } }
            foreach ($sp in 'sag','msn','fregene','ostia','torva','anzio','latina','fondi') { foreach ($fo in 'wg','om') { foreach ($an in 0,1) { for ($h = 6; $h -le 20; $h++) { $pf.Add("$gg;$sp;$an;$fo;$h;$(10 + $h % 9);$(15 + $h % 9);240;06:30") } } } } }
          $mo = (Get-Date).ToString('yyyy-MM')
          [IO.File]::AppendAllLines("$rk\dati\letture-$mo.csv", [string[]](@('data;stazione;spot;vento;raffica;gradi') + $lt))
          if ($mo -eq $mese) { [IO.File]::AppendAllLines("$rk\dati\previsioni-$mo.csv", [string[]]$pf) } else { [IO.File]::WriteAllLines("$rk\dati\previsioni-$mo.csv", [string[]](@('giorno;spot;anticipo;fonte;ora;vento;raffica;gradi;salvata') + $pf)) }
          "storico finto: $($lt.Count) letture, $($pf.Count) previsioni"
          # Open-Meteo finto (dai server di GitHub il servizio va in timeout): 8 spot, 9 giorni, ora per ora.
          $oggi = (Get-Date).Date; $loc = @()
          for ($i = 0; $i -lt 8; $i++) {
            $time = @(); $temp = @(); $code = @(); $rain = @(); $ws = @(); $wg = @(); $wd = @()
            for ($hh = 0; $hh -lt 216; $hh++) {
              $t = $oggi.AddHours($hh); $time += $t.ToString("yyyy-MM-dd'T'HH:mm"); $temp += 14 + [int]($t.Hour -gt 11 -and $t.Hour -lt 17) * 3
              $code += @(0, 2, 3, 61, 95)[([int]($hh / 24) + $i) % 5] ; $rain += 0.2; $ws += 8 + [int]($t.Hour -ge 10 -and $t.Hour -le 15) * 9 + $i; $wg += 14 + $i; $wd += 250
            }
            $loc += [ordered]@{ latitude = 41; longitude = 12; hourly = [ordered]@{ time = $time; temperature_2m = $temp; weather_code = $code; precipitation = $rain; wind_speed_10m = $ws; wind_gusts_10m = $wg; wind_direction_10m = $wd } }
          }
          [IO.File]::WriteAllText("$PWD\om-prova.json", (ConvertTo-Json -InputObject $loc -Depth 6 -Compress))
      - name: Avvia Radar kite 2.0
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -Command "& '.\radarkite\radar-kite.ps1' -NonAprire -OmProva '%CD%\om-prova.json'"
      - name: Avvio automatico, diario dal link, PDF
        shell: powershell
        run: |
          $t = Get-ScheduledTask -TaskName 'Radar kite'; "Attivita': $($t.TaskName) - $($t.Actions[0].Arguments)"; $t.Triggers | ForEach-Object { "Inizio $($_.StartBoundary) ogni $($_.Repetition.Interval) per $($_.Repetition.Duration)" }
          $prima = (Get-Item radarkite\report.html).LastWriteTime
          Start-Process 'radarkite://uscita?d=2026-11-18&o=11:00&s=ostia&m=60&v=12&n=prova+dal+link'
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 2; if ((Get-Item radarkite\report.html).LastWriteTime -gt $prima) { break } }
          "Diario:"; Get-Content radarkite\dati\diario.csv
          "Corsa automatica:"; powershell -NoProfile -ExecutionPolicy Bypass -File radarkite\radar-kite.ps1 -Automatico -OmProva "$PWD\om-prova.json" | Select-Object -Last 5
          "Avvio come l'attivita' (conhost --headless):"; $prima = (Get-Item radarkite\report.html).LastWriteTime
          $p = Start-Process "$env:SystemRoot\System32\conhost.exe" -ArgumentList ('--headless "' + "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" + '" -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "' + "$PWD\radarkite\radar-kite.ps1" + '" -Automatico -OmProva "' + "$PWD\om-prova.json" + '"') -PassThru
          $p.WaitForExit(240000) | Out-Null; Start-Sleep 3; "report aggiornato: $((Get-Item radarkite\report.html).LastWriteTime -gt $prima)"
          "Attivita' avviata dallo scheduler:"; $prima = (Get-Item radarkite\report.html).LastWriteTime; Start-ScheduledTask -TaskName 'Radar kite'
          for ($i = 0; $i -lt 90; $i++) { Start-Sleep 2; if ((Get-Item radarkite\report.html).LastWriteTime -gt $prima) { break } }
          $ti = Get-ScheduledTaskInfo -TaskName 'Radar kite'; "report aggiornato: $((Get-Item radarkite\report.html).LastWriteTime -gt $prima) - esito $('0x{0:X}' -f $ti.LastTaskResult)"
          "File dati:"; Get-ChildItem radarkite\dati | ForEach-Object { "$($_.Name) $($_.Length)" }
          "PDF:"; Get-ChildItem pdfout | ForEach-Object { "$($_.Name) $($_.Length)" }
          "Viaggi:"; if (Test-Path radarkite\dati\viaggi.json) { Get-Content radarkite\dati\viaggi.json }
          "Avvio dal file .bat (nascosto):"; $prima = (Get-Item radarkite\report.html).LastWriteTime; cmd /c "radarkite\Avvia Radar kite 2.6.bat"
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 2; $h = [IO.File]::ReadAllText("$PWD\radarkite\report.html"); if ((Get-Item radarkite\report.html).LastWriteTime -gt $prima -and $h -match '"aggiornando":false') { break } }
          "report finale dal .bat: $((Get-Item radarkite\report.html).LastWriteTime -gt $prima) $([regex]::Match($h, '"aggiornando":\w+').Value) dopo $($i * 2) s"; Get-Content radarkite\dati\ultimo-avvio.txt -TotalCount 12
          foreach ($cosa in @('spot?id=latina', 'stazione?id=latina_lido')) { $t0 = Get-Date; powershell -NoProfile -ExecutionPolicy Bypass -File radarkite\radar-kite.ps1 -Link "radarkite://$cosa" -OmProva "$PWD\om-prova.json" | Select-String 'Aggiorno solo|ERRORE|Report:'; $h = [IO.File]::ReadAllText("$PWD\radarkite\report.html"); "solo $cosa in $([Math]::Round(((Get-Date) - $t0).TotalSeconds, 1)) s; creato $([regex]::Match($h, '"creato":"[^"]*"').Value); latina $([regex]::Match($h, '"id":"latina"[^{]{0,40}').Value) $([regex]::Matches($h, '"aggiornato":"[^"]*"') | Select-Object -First 12 | ForEach-Object { $_.Value.Substring(14) })" }
          "Indirizzi dalla pagina:"; powershell -NoProfile -ExecutionPolicy Bypass -File radarkite\radar-kite.ps1 -Link 'radarkite://indirizzi?c=Piazza%20Venezia%201%2C%20Roma%20(41.86400%2C%2012.47700)&l=&p=casa' -OmProva "$PWD\om-prova.json" | Select-String 'Partenza salvata|viaggio|ERRORE'
          Get-Content radarkite\impostazioni.txt | Select-String '^(casa|lavoro|partenza) ='; (Select-String -Path radarkite\report.html -Pattern '"partenza":\{[^}]*\}').Matches.Value
          "Partenza lavoro (coordinate):"; powershell -NoProfile -ExecutionPolicy Bypass -File radarkite\radar-kite.ps1 -Link 'radarkite://partenza?p=lavoro' -OmProva "$PWD\om-prova.json" | Select-String 'viaggio|ERRORE'
          Get-Content radarkite\dati\viaggi.json; (Select-String -Path radarkite\report.html -Pattern '"partenza":\{[^}]*\}').Matches.Value
      - name: Report e PDF in base64 a pezzi
        if: always()
        shell: powershell
        run: |
          function Pezzi($tag, $file) { if (-not (Test-Path $file)) { return }; $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes($file)); for ($i = 0; $i -lt $b.Length; $i += 40000) { "$tag" + ($i / 40000) + ':' + $b.Substring($i, [Math]::Min(40000, $b.Length - $i)) } }
          Pezzi 'HTML' 'radarkite\report.html'
          Pezzi 'PDF' 'pdfout\Radar kite.pdf'
